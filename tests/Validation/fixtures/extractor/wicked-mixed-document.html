<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wicked Mixed Document</title>

    <!-- A deliberately messy page: valid structured data of every supported
         format is interleaved with malformed markup, so the extractor has to
         keep the usable elements and drop the broken ones without giving up. -->

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Wicked Valid Json"
    }
    </script>

    <script type="application/ld+json">
    { "@context": "https://schema.org", "@type": "BarOrPub", "name":"Speechless Bar" }
    </script>

    <!-- Malformed JSON-LD: a trailing comma and an unclosed brace. It must be
         detected as a JSON-LD script tag but skipped as unusable. -->
    <script type="application/ld+json">
    { "@context": "https://schema.org", "@type": "Thing", "name": "Broken Json",, }
    </script>
</head>
<body>
    <h1>Wicked mixed document</h1>

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Event",
        "name": "Speechless Monthly Program - April 2026"
    }
    </script>

    <div itemscope itemtype="https://schema.org/Product">
        <span itemprop="name">Wicked Valid Micro</span>
    </div>

    <ul itemscope itemtype="https://schema.org/ItemList">
        <li itemprop="name">Speechless program highlights</li>
    </ul>

    <!-- Broken microdata: itemscope with itemtype but only misspelled itemprop
         attributes, so it is extractable but content-less. -->
    <div itemscope itemtype="https://schema.org/Person">
        <span itempropp="name">No One</span>
    </div>

    <section vocab="https://schema.org/" typeof="Organization">
        <span property="name">Wicked Valid RDFa</span>
    </section>

    <!-- Broken RDFa: schema.org properties with no typed subject. -->
    <section vocab="https://schema.org/">
        <span property="name">Broken RDFa</span>
    </section>
</body>
</html>
