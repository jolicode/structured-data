name: Run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      google_docs_strict:
        description: "Fail job if google:generation:verify-docs reports gaps"
        required: false
        default: "false"
  schedule:
    - cron: "0 0 * * SUN"

jobs:
  ci:
    name: Test with PHP ${{ matrix.php-version }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: castor

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Install qa tooling
        run: castor install

      - name: Check PHP coding standards
        run: castor qa:cs --dry-run

      - name: Run PHPStan
        run: castor qa:phpstan

      - name: Run the tests
        run: castor qa:phpunit:run

      - name: Install generator tooling
        run: composer install --working-dir tools/generator --prefer-dist --no-progress

      - name: Verify Google docs coverage (report-only by default)
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' || inputs.google_docs_strict != 'true' }}
        run: castor google:generation:verify-docs

      - name: Check that schema.org types and properties classes can be generated
        run: castor generation:generate
