<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JsonLd Valid Single</title>
</head>
<body>
    <main>
        <h1>Simple fixture with one valid JSON-LD item</h1>
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Person",
            "name": "Single JsonLd",
            "url": "https://example.com/single-jsonld"
        }
        </script>
    </main>
</body>
</html>
