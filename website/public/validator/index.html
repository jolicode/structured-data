<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

        <title>Structured Data Validator, by JoliCode</title>
        <meta name="description" content="Validate the structured data of a page against schema.org and the Google Rich Results requirements, in your browser." />
        <meta name="author" content="JoliCode" />

        <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">

        <!-- Both are built by "castor website:build" -->
        <link rel="stylesheet" href="../build/app.css">
        <script type="module" src="../build/validator.js"></script>
    </head>
    <body class="bg-white font-sans text-gray-900 antialiased">
        <main class="flex min-h-screen flex-col bg-gray-50">
            <!-- The same backdrop, logo and menu as the homepage, see ../index.html. The links of the menu carry the document, see assets/pageState.js -->
            <header class="home-backdrop relative isolate flex flex-wrap items-center justify-between gap-3 border-b border-gray-200 bg-white px-6 py-3">
                <a href="../" class="inline-flex items-center gap-2.5 font-display text-[15px] font-semibold text-gray-900">
                    <span class="grid size-8 place-items-center rounded-lg bg-joli font-mono text-sm font-bold text-gray-900 shadow-sm ring-1 ring-gray-900/10" aria-hidden="true">{ }</span>
                    Structured Data Validator
                </a>
                <nav class="flex flex-wrap items-center gap-x-6 gap-y-2 text-sm text-gray-700" aria-label="Main">
                    <a href="./" class="site-nav-link" aria-current="page" data-state-link>Validator</a>
                    <a href="../playground/" class="site-nav-link" data-state-link>JSON-LD Playground</a>
                    <a href="https://github.com/jolicode/structured-data" class="inline-flex min-h-9 items-center gap-1.5 rounded-full bg-white/70 px-3 ring-1 ring-gray-900/10 backdrop-blur hover:text-gray-950 hover:ring-gray-900/30">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
                        GitHub
                    </a>
                </nav>
            </header>

            <!-- The frame of the result is here, to show as the page opens: the editor has the document before PHP has started. PHP renders what it finds: the counts, and the entities. See assets/controllers/result_controller.js -->
            <div class="flex flex-1 flex-wrap items-start gap-5 p-5" data-controller="result">
                <!-- The editor is as high as what the window leaves under the header, less the margins: a short result does not make the page scroll -->
                <section class="min-w-0 flex-[1_1_480px] lg:sticky lg:top-5" aria-label="Document">
                    <div class="h-[60vh] overflow-hidden rounded-2xl border border-gray-200 bg-white lg:h-[calc(100vh-6.5rem)]" data-result-target="editor"></div>
                </section>

                <div class="flex min-w-0 flex-[1_1_480px] flex-col gap-4">
                    <!-- What is found, and what to do with it: it stays above the entities, that scroll under it -->
                    <div class="result-toolbar">
                        <!-- templates/counts.html.twig, as high with them as without -->
                        <div class="flex min-h-6 flex-wrap items-center gap-x-3 gap-y-2" data-result-target="counts"></div>

                        <!-- Says when the document is validated again: it is as it is typed -->
                        <span class="text-xs text-gray-600" role="status" data-result-target="status"></span>

                        <div class="flex w-full flex-wrap items-center gap-2">
                            <!-- These two are for the entities: disabled when there is none -->
                            <label class="flex min-h-9 cursor-pointer items-center gap-2 px-1 text-[13px] font-medium text-gray-900 has-disabled:cursor-default has-disabled:opacity-50">
                                <input
                                    type="checkbox"
                                    role="switch"
                                    class="peer sr-only"
                                    checked
                                    disabled
                                    data-result-target="showDescriptions"
                                    data-action="result#toggleDescriptions"
                                >
                                <span class="relative h-5 w-9 shrink-0 rounded-full bg-gray-300 transition-colors after:absolute after:left-0.5 after:top-0.5 after:size-4 after:rounded-full after:bg-white after:shadow-sm after:transition-transform peer-checked:bg-gray-900 peer-checked:after:translate-x-4 peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-gray-900" aria-hidden="true"></span>
                                Show descriptions
                            </label>

                            <button
                                type="button"
                                class="min-h-9 rounded-lg border border-gray-300 bg-white px-3 text-[13px] font-medium text-gray-900 hover:border-gray-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 disabled:opacity-50"
                                title="Expand or collapse the properties of every entity"
                                disabled
                                data-result-target="expandButton"
                                data-action="result#toggleAll"
                                aria-expanded="false"
                            >
                                Expand all
                            </button>

                            <!-- Its panel opens under the toolbar, and is never wider: the button is anywhere in it, on a narrow window -->
                            <div
                                data-result-target="settingsWrapper"
                                data-action="click@window->result#closeSettingsOnOutsideClick"
                            >
                                <button
                                    type="button"
                                    class="inline-flex min-h-9 items-center gap-1.5 rounded-lg border border-gray-300 bg-white px-3 text-[13px] font-medium text-gray-900 hover:border-gray-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900"
                                    data-result-target="settingsButton"
                                    data-action="result#toggleSettings"
                                    aria-expanded="false"
                                    aria-haspopup="true"
                                >
                                    <!-- assets/images/settings.svg -->
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.24-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.992a7.723 7.723 0 0 1 0-.255c.007-.378-.138-.75-.43-.991l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                    </svg>
                                    Settings
                                </button>

                                <div
                                    class="absolute right-4 top-full z-10 mt-2 hidden w-80 max-w-[calc(100%-2rem)] rounded-xl border border-gray-200 bg-white p-4 text-sm shadow-xl shadow-gray-900/10"
                                    data-result-target="settingsPanel"
                                >
                                    <h2 class="font-display text-sm font-semibold text-gray-900">Validation settings</h2>

                                    <label class="flex cursor-pointer items-start gap-2 pt-3">
                                        <input type="checkbox" class="mt-0.5 size-4 shrink-0 accent-gray-900" data-result-target="settingMergeNodes">
                                        <span>
                                            <span class="block font-medium text-gray-900">Merge entities with the same @id</span>
                                            <span class="block text-xs text-gray-600">Treat the blocks sharing an "@id" or "itemid" as a single entity, validated as a whole. A property one block provides is not reported missing in another.</span>
                                        </span>
                                    </label>

                                    <label class="flex cursor-pointer items-start gap-2 pt-3">
                                        <input type="checkbox" class="mt-0.5 size-4 shrink-0 accent-gray-900" data-result-target="settingAllowPending">
                                        <span>
                                            <span class="block font-medium text-gray-900">Allow pending vocabulary</span>
                                            <span class="block text-xs text-gray-600">Do not warn when a type or property belongs to a schema.org extension still under development, like pending.schema.org.</span>
                                        </span>
                                    </label>

                                    <label class="flex cursor-pointer items-start gap-2 pt-3">
                                        <input type="checkbox" class="mt-0.5 size-4 shrink-0 accent-gray-900" data-result-target="settingAutoExpandWarnings">
                                        <span>
                                            <span class="block font-medium text-gray-900">Show the warnings</span>
                                            <span class="block text-xs text-gray-600">Unfold the warnings of each entity when the results load.</span>
                                        </span>
                                    </label>

                                    <div class="mt-4 flex justify-end border-t border-gray-200 pt-3">
                                        <button
                                            type="button"
                                            class="min-h-9 rounded-lg bg-gray-900 px-3 text-[13px] font-semibold text-white hover:bg-gray-700"
                                            data-action="result#saveSettings"
                                        >
                                            Save
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <button
                                type="button"
                                class="min-h-9 rounded-lg border border-gray-300 bg-white px-3 text-[13px] font-medium text-gray-900 hover:border-gray-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 disabled:opacity-50"
                                title="Reformat the document"
                                data-result-target="formatButton"
                                data-action="result#format"
                            >
                                Format
                            </button>

                            <!-- Enabled once the document is written in the URL -->
                            <button
                                type="button"
                                class="min-h-9 rounded-lg border border-gray-300 bg-white px-3 text-[13px] font-medium text-gray-900 hover:border-gray-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900 disabled:opacity-50"
                                disabled
                                data-result-target="copyLink"
                                data-action="result#copyLink"
                            >
                                Copy link
                            </button>
                        </div>

                        <!-- Why the document is not validated, or not formatted -->
                        <p class="w-full text-sm text-red-700 empty:hidden" role="alert" data-result-target="error"></p>
                    </div>

                    <!-- templates/result.html.twig, in place of what holds its place. A click on what it locates selects it in the editor -->
                    <section class="flex flex-col gap-4" aria-label="Result" data-result-target="nodes" data-action="click->result#showInDocument">
                        <p class="rounded-2xl border border-dashed border-gray-300 px-5 py-10 text-center text-sm text-gray-600" role="status" data-result-target="pending">Validating your document…</p>
                    </section>
                </div>
            </div>
        </main>
    </body>
</html>
