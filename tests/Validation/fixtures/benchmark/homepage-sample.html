<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Example Corp — Sample homepage fixture</title>
<meta name="description" content="Synthetic benchmark fixture. Not a real page."/>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Example Corp",
  "url": "https://example.com/",
  "logo": "https://example.com/logo.svg",
  "email": "contact@example.com",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "1 Example Street",
    "addressLocality": "Example City",
    "postalCode": "00000",
    "addressCountry": "FR"
  },
  "sameAs": [
    "https://example.com/about",
    "https://example.com/contact"
  ]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Example Corp",
  "url": "https://example.com/",
  "inLanguage": "en",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://example.com/search?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
</head>
<body>
<header><h1>Example Corp</h1><p>Synthetic fixture used by the benchmark suite.</p></header>
<main>
  <section><h2>Services</h2><p>Placeholder content, generated for benchmarking purposes only.</p></section>
  <section><h2>Contact</h2><p>contact@example.com</p></section>
</main>
<footer><p>&copy; Example Corp</p></footer>
</body>
</html>
